services:
  football-bot:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN:-}
      DATA_FILE: /data/bot.db
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "4"
